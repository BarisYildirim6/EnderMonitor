<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Print Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
</head>
<body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  }

  window.onload = function () {
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkModeSwitch').checked = true;
    }
    if (window.location.pathname == "/") {
      const img = document.getElementById('video-stream');
      const timestamp = new Date().getTime();
      img.src = `/video_feed?ts=${timestamp}`;  // Bust cache
    }
  };
</script>

<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="p-3" id="sidebar-wrapper">
    <h4 class="text-center">3D Print Monitor</h4>
    <ul class="nav flex-column mt-4">
      <li class="nav-item"><a href="/" class="nav-link">Status</a></li>
      <li class="nav-item"><a href="/logger" class="nav-link">Logs</a></li>
    </ul>
    <div class="text-end p-2">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkModeSwitch" onchange="toggleDarkMode()">
            <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>
        </div>
    </div>
  </div>
  {% block main %}
  {% endblock %}
</body>
</html>
